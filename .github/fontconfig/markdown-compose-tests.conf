<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    ImageComposeScene and Tiqian's Skia backend must resolve the same physical
    face. GitHub's Linux image does not carry the CJK/Latin candidates used by
    the desktop backend, so pin every family the tests can request to the
    repository-owned fixture instead of accepting host fallback.
  -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Inter Variable</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Inter</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SF Pro Text</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SF Pro</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Roboto</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
</fontconfig>
